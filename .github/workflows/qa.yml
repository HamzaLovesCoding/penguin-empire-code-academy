# Runs the Puppeteer QA harnesses (audit.mjs, smoke.mjs) against the static
# site. Runs on every pull request, and is called by pages.yml so a failing
# check blocks the deploy to GitHub Pages.
name: QA

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The QA scripts default to the macOS Chrome path; use the runner's Chrome.
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # puppeteer-core does not download a browser, so this is quick.
      - run: npm ci

      - name: Start local server
        run: |
          node serve.mjs > serve.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:4321/ > /dev/null && exit 0
            sleep 1
          done
          echo "Server failed to start" >&2
          cat serve.log >&2
          exit 1

      # Markup contract, broken links, console errors, 390px overflow.
      - name: Audit
        run: node audit.mjs

      # Clicks every Check button with right and wrong answers.
      - name: Smoke test
        run: node smoke.mjs
