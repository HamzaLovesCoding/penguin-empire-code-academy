<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Curriculum · Penguin Empire 2551 Code Academy</title>
  <meta name="description" content="The complete Penguin Empire 2551 programming curriculum: Phase 1 teaches Java & OOP from zero, Phase 2 applies it to a real FRC robot. Both phases are required." />
  <link rel="icon" href="/assets/img/logo-2551.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Aldrich&family=Russo+One&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <!-- Theme before first paint: saved choice, else the OS setting. -->
  <script>(function(){var t;try{t=localStorage.getItem("pe-theme")}catch(e){}document.documentElement.dataset.theme=t||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")})()</script>
  <link rel="stylesheet" href="/assets/css/brand.css" />
  <link rel="stylesheet" href="/assets/css/layout.css" />
  <link rel="stylesheet" href="/assets/css/pages.css" />
</head>
<body data-page="syllabus">
  <main id="main">
    <div class="page-head">
      <div class="container">
        <span class="badge badge--dot">The full map</span>
        <h1 style="margin-top:12px">The Curriculum</h1>
        <p>Everything you'll learn, in order. Both phases are required to program a robot.
           Phase 1 builds the Java foundation and Phase 2 puts it on the machine. Lessons marked
           <b>”Locked”</b> are written and on the way.</p>
      </div>
    </div>

    <div class="syllabus" id="syllabus-root"></div>
  </main>

  <script src="/assets/js/course.js"></script>
  <script src="/assets/js/site.js" defer></script>
  <script>
    (function () {
      const C = window.COURSE;
      const P = null; // progress read after site.js loads; we re-sync via data attrs
      const chev = '<svg class="syl-unit-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
      const check = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
      const root = document.getElementById("syllabus-root");
      // Progress is read straight from storage here: this script runs before
      // site.js (deferred) has defined window.Progress. Read-only.
      let done = {};
      try { done = JSON.parse(localStorage.getItem(C.meta.storageKey)) || {}; } catch {}
      const next = C.readyList().find((l) => !done[l.id]);
      const ring = (pct) => `<svg class="st-ring" viewBox="0 0 48 48" aria-hidden="true"><circle class="bg" cx="24" cy="24" r="20"/><circle class="fg" cx="24" cy="24" r="20" pathLength="100" stroke-dasharray="100" stroke-dashoffset="${100 - pct}"/></svg>`;
      let html = "";
      C.tracks.forEach((tr, ti) => {
        const total = tr.units.reduce((n, u) => n + u.lessons.length, 0);
        const doneN = tr.units.reduce((n, u) => n + u.lessons.filter((l) => done[l.id]).length, 0);
        const pct = Math.round((doneN / Math.max(1, total)) * 100);
        html += `<section class="syl-track" id="${tr.id}">
          <div class="syl-track-head ${tr.id}">
            <span class="st-badge">${tr.tag}</span>
            <div><h2>${tr.label}</h2><p>${total} lessons · ${tr.units.length} units</p></div>
            <div class="st-prog">${ring(pct)}<div><b>${pct}%</b><span>${doneN} of ${total} done</span></div></div>
          </div>`;
        tr.units.forEach((u, ui) => {
          const isCurrent = next ? u.lessons.some((l) => l.id === next.id) : false;
          // Open the unit the student is in; first-timers see Unit J1 open.
          const open = isCurrent || (!next && ti === 0 && ui === 0);
          const ready = u.lessons.filter((l) => l.ready);
          const n = ready.filter((l) => done[l.id]).length;
          const complete = ready.length > 0 && n === ready.length;
          const cls = ["syl-unit", complete ? "is-complete" : "", isCurrent ? "is-current" : ""].join(" ").trim();
          html += `<div class="${cls}" aria-expanded="${open}">
            <div class="syl-unit-head" role="button" tabindex="0">
              <span class="syl-unit-num">${complete ? check : u.num}</span>
              <div class="syl-unit-info"><h3>${u.title}</h3><p>${u.sub}</p></div>
              <span class="syl-unit-count">${n} / ${u.lessons.length} lessons<span class="syl-mini"><i style="width:${Math.round((n / u.lessons.length) * 100)}%"></i></span></span>
              ${chev}
            </div>
            <ul class="syl-lessons">`;
          u.lessons.forEach((l) => {
            const tag = l.ready ? `<span class="sl-tag">${l.dur || "Ready"}</span>` : `<span class="sl-tag">Locked</span>`;
            const isNext = next && l.id === next.id;
            const cls = [l.ready ? "" : "is-soon", isNext ? "is-next" : ""].join(" ").trim();
            // Manifest hrefs are real paths; SITE_BASE mounts the site on a sub-path.
            const href = l.ready ? (window.SITE_BASE || "") + l.href : "#";
            html += `<li><a class="${cls}" href="${href}" data-syl-link="${l.id}">
              <span class="sl-dot">${check}</span>
              <span class="sl-title">${l.t}</span>${isNext ? `<span class="sl-next">Up next</span>` : ""}${tag}</a></li>`;
          });
          html += `</ul></div>`;
        });

        // Each track ends with its phase exam. Exams sit outside the lesson
        // sequence, so they never count toward the progress percentage.
        const ex = C.examFor(tr.id);
        if (ex && ex.ready) {
          html += `<div class="syl-unit" aria-expanded="true">
            <div class="syl-unit-head" role="button" tabindex="0">
              <span class="syl-unit-num">${check}</span>
              <div class="syl-unit-info"><h3>${ex.t}</h3><p>${ex.sub}</p></div>
              <span class="syl-unit-count">Exam</span>
              ${chev}
            </div>
            <ul class="syl-lessons">
              <li><a href="${(window.SITE_BASE || "") + ex.href}">
                <span class="sl-dot">${check}</span>
                <span class="sl-title">Take the exam</span>
                <span class="sl-tag">25 questions</span></a></li>
            </ul></div>`;
        }
        html += `</section>`;
      });

      // Reference pages, also outside the lesson sequence.
      const refs = C.readyResources();
      if (refs.length) {
        html += `<section class="syl-track">
          <div class="syl-track-head ref">
            <span class="st-badge">Reference</span>
            <div><h2>Look it up</h2><p>${refs.length} pages · not counted in your progress</p></div>
          </div>
          <div class="syl-unit" aria-expanded="true">
            <div class="syl-unit-head" role="button" tabindex="0">
              <span class="syl-unit-num">R</span>
              <div class="syl-unit-info"><h3>Cheat-sheets &amp; reference</h3><p>For build season and the pit, not for your first read.</p></div>
              <span class="syl-unit-count">${refs.length} pages</span>
              ${chev}
            </div>
            <ul class="syl-lessons">`;
        refs.forEach((r) => {
          html += `<li><a href="${(window.SITE_BASE || "") + r.href}">
            <span class="sl-dot">${check}</span>
            <span class="sl-title">${r.t}</span>
            <span class="sl-tag">Reference</span></a></li>`;
        });
        html += `</ul></div></section>`;
      }

      root.innerHTML = html;
      root.querySelectorAll(".syl-unit-head").forEach((head) => {
        const toggle = () => { const u = head.closest(".syl-unit"); u.setAttribute("aria-expanded", u.getAttribute("aria-expanded") === "true" ? "false" : "true"); };
        head.addEventListener("click", toggle);
        head.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } });
      });
      // sync completed state once Progress exists
      const sync = () => { if (window.Progress) root.querySelectorAll("[data-syl-link]").forEach((a) => a.classList.toggle("is-done", window.Progress.isDone(a.dataset.sylLink))); };
      setTimeout(sync, 0); window.addEventListener("load", sync);
    })();
  </script>
</body>
</html>
